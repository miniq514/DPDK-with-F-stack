# configs/config.dac.ini
#
# F-Stack 收端配置 — dac 链路（f1 / enp66s0f1 / PCI 0000:42:00.1）
# 全 IPv6（对齐 docs/README.md 1.0.1）：8004 收端 …:0003，UDP 8888。
# file_prefix 与 pktgen(udp_pktgen_tx) 隔离，复用本机 /dev/hugepages 大页池。
#
# 用法：
#   sudo ./scripts/run_recv.sh --link dac ...
#   等价: sudo ./build/fstack_udp_recv -c configs/config.dac.ini -- <app args>

[dpdk]
# 收端单线程 RX + writer pthread；lcore_mask=1 = core0
lcore_mask=1
file_prefix=fstack_recv8004
channel=4
promiscuous=1
# KNI+virtio_user 时勿用 numa_on=1：init_port_start 会对 virtio 口读 port_cfgs[u_port_id]，易踩未初始化配置
numa_on=0
tx_csum_offoad_skip=1
# TCP 必须关 TX checksum offload：82599 硬件 TCP csum 会导致 F-Stack 回 ACK 校验错误，
# 对端 cwnd 塌缩/RTO 飙升，表现为收端只吃到前几十帧后停滞。
tso=0
vlan_strip=1
vlan_filter=0
idle_sleep=0
pkt_tx_delay=0
symmetric_rss=0

# 仅启用 f1（0000:42:00.1）
port_list=0
allow=0000:42:00.1

nb_vdev=0
nb_bond=0

[pcap]
enable=0
snaplen=96
savelen=16777216
savepath=/tmp/fstack_pcap
timestamp_precision=0

[stack]
kernel_coexist=0

# KNI（virtio-user → 内核 veth0）：业务 UDP/TCP 8888 留 F-Stack；其余（含 TCP/22、ICMPv6）进内核运维口
[kni]
enable=1
method=reject
tcp_port=8888
udp_port=8888

# 收端 8004 f1：IPv6 …:0003/64，UDP bind 端口由应用 --dst-port 传入（默认 8888）
# F-Stack ff_check_config 仍强制校验 IPv4 四元组；实际联调走 addr6，以下 IPv4 仅占位。
[port0]
addr=192.168.1.2
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
addr6=1111:2222:1111:2222:1111:2222:1111:0003
prefix_len=64
if_name=enp66s0f1

[freebsd.boot]
hz=100
fd_reserve=1024
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144
kern.features.inet6=1

[freebsd.sysctl]
kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=16777216
net.add_addr_allfibs=1
net.link.ether.inet.maxhold=5
net.inet.udp.blackhole=1
net.inet.ip.redirect=0
net.inet.ip.forwarding=0
net.inet6.ip6.auto_linklocal=1
net.inet6.ip6.accept_rtadv=2
net.inet6.icmp6.rediraccept=1
net.inet6.ip6.forwarding=0
# 禁用 DAD（Duplicate Address Detection）：F-Stack 把 addr6 标记为 IN6_IFF_AUTOCONF，
# 默认会进入 TENTATIVE 状态做 DAD，导致 ff_bind 失败 + 收包被栈丢弃。
# dad_count=0 → nd6_dad_start 直接清除 TENTATIVE，地址立即可用。
net.inet6.ip6.dad_count=0
# TCP 收端：关闭延迟 ACK，加快对端窗口推进（内核发端易被 RTO 拖死）
net.inet.tcp.delayed_ack=0
net.inet.tcp.recvspace=1048576
net.inet.tcp.sendspace=1048576
net.inet.tcp.recvbuf_max=16777216
net.inet.tcp.sendbuf_max=16777216
