# configs/config.fibre.ini
#
# F-Stack 收端配置 — fibre 链路（f0 / enp66s0f0 / PCI 0000:42:00.0，光口）
# 全 IPv6：8007 收端 …:0002（与 dac 收端地址相同），UDP 8888。
# 发端为交换板 FPGA（…:0001），不走 sender pktgen。
#
# 用法：
#   sudo ./scripts/run_recv.sh --link fibre ...
#   等价: sudo ./build/fstack_udp_recv -c configs/config.fibre.ini -- <app args>

[dpdk]
lcore_mask=1
file_prefix=fstack_recv8004
channel=4
promiscuous=1
numa_on=1
tx_csum_offoad_skip=0
tso=0
vlan_strip=1
vlan_filter=0
idle_sleep=0
pkt_tx_delay=0
symmetric_rss=0

# 仅启用 f0（0000:42:00.0）
port_list=0
allow=0000:42:00.0

nb_vdev=0
nb_bond=0

[pcap]
enable=0
snaplen=96
savelen=16777216
savepath=.
timestamp_precision=0

[stack]
kernel_coexist=0

# 收端 8007 f0：IPv6 …:0002/64；MAC 需与交换板 FPGA Dst_Mac 一致（90:e2:ba:50:aa:70）
# MAC 由 release_env.sh / setup_env.sh 在内核态显式设置；DPDK 占用期间由网卡硬件处理
# F-Stack ff_check_config 仍强制校验 IPv4 四元组；实际联调走 addr6，以下 IPv4 仅占位。
[port0]
addr=192.168.1.2
netmask=255.255.255.0
broadcast=192.168.1.255
gateway=192.168.1.1
addr6=1111:2222:1111:2222:1111:2222:1111:0002
prefix_len=64
if_name=enp66s0f0

[freebsd.boot]
hz=100
fd_reserve=1024
kern.ipc.maxsockets=262144
net.inet.tcp.syncache.hashsize=4096
net.inet.tcp.syncache.bucketlimit=100
net.inet.tcp.tcbhashsize=65536
kern.ncallout=262144
kern.features.inet6=1

[freebsd.sysctl]
kern.ipc.somaxconn=32768
kern.ipc.maxsockbuf=16777216
net.add_addr_allfibs=1
net.link.ether.inet.maxhold=5
net.inet.udp.blackhole=1
net.inet.ip.redirect=0
net.inet.ip.forwarding=0
net.inet6.ip6.auto_linklocal=1
net.inet6.ip6.accept_rtadv=2
net.inet6.icmp6.rediraccept=1
net.inet6.ip6.forwarding=0
# 禁用 DAD：F-Stack addr6 标记为 IN6_IFF_AUTOCONF，默认 TENTATIVE 导致 bind 失败+收包丢弃
net.inet6.ip6.dad_count=0
